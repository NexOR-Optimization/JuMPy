name: juliac backend

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test-entrypoints:
    name: Julia entry-point tests (in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13.2"

      - uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=julia/test -e 'using Pkg; Pkg.instantiate()'

      - name: Run entry-point tests
        run: julia --project=julia/test julia/test/runtests.jl

  build-lib:
    name: Build and test compiled library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      JULIA_CPU_TARGET: generic
    # Git Bash on Windows.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: lib/libjumpy_highs.so
          - os: macos-latest
            library: lib/libjumpy_highs.dylib
          - os: windows-latest
            library: bin/libjumpy_highs.dll
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13.2"

      - uses: julia-actions/cache@v2

      - name: Install JuliaC
        run: julia --project=@juliac -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaC", version="0.3.12"))'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Trace the workload, compile the recipe and copy the bundle into
      # src/jumpy/_backends/highs for the wheel.
      - name: Build shared library
        # Link for the macOS of the bundled Julia libraries, not the runner's.
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: uv run --no-project python julia/build_backend.py julia/backends/highs --package src

      - name: Run tests against the compiled library
        run: uv run --group tests pytest
        env:
          JUMPY_BACKEND: juliac
          JUMPY_LIB: ${{ github.workspace }}/julia/backends/highs/build/bundle/${{ matrix.library }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-backend-${{ matrix.os }}
          path: julia/backends/highs/build/bundle

      - name: Build wheel with the bundle
        run: uv build --wheel

      # Outside the checkout, so that the tests import the installed package.
      - name: Test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          # A POSIX path, which Git Bash also globs on Windows.
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd)
          uv venv wheel-env
          uv pip install --python wheel-env "$workspace"/dist/*.whl pytest
          python=wheel-env/bin/python
          [ -e "$python" ] || python=wheel-env/Scripts/python
          "$python" -c "import sys, jumpy.backend as b; lib = b.find_lib('highs'); print(lib); sys.exit(lib is None or 'site-packages' not in lib)"
          # A first solve outside pytest, whose capture hides the stderr of a
          # process that exits during a test.
          "$python" -X faulthandler -c "import jumpy.highs as jp; m = jp.Model(); x = m.variable(lower=1); m.objective = jp.minimize(x); m.optimize(); print(m.value(x))"
          "$python" -m pytest -p no:cacheprovider "$workspace/tests"
        env:
          JUMPY_BACKEND: juliac

      # The runner has development packages, such as the `libpcre2-8.so` that
      # Julia opens, which hide the libraries missing from the wheel.
      - name: Test the wheel on a system without development packages
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3.12-slim-trixie sh -c \
            'pip install --root-user-action=ignore -q /dist/*.whl && python -c "import jumpy.highs as jp; m = jp.Model(); x = m.variable(lower=1); m.objective = jp.minimize(x); m.optimize(); print(m.value(x))"'

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-wheel-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Build source distribution
        run: uv build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build-lib, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jumpy-opt
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: jumpy-wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: jumpy-sdist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  build-nexor:
    name: Build and test compiled NexOR client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      JULIA_CPU_TARGET: generic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: libjumpy_nexor.so
          - os: macos-latest
            library: libjumpy_nexor.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13.2"
      - uses: julia-actions/cache@v2
      - name: Install JuliaC
        run: julia --project=@juliac -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaC", version="0.3.12"))'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build shared library
        run: uv run --no-project python julia/build_backend.py julia/backends/nexor
      - name: Run tests against the compiled library
        run: uv run --group tests pytest tests/test_nexor.py tests/test_backend.py tests/test_facades.py
        env:
          JUMPY_BACKEND: nexor
          JUMPY_LIB: ${{ github.workspace }}/julia/backends/nexor/build/bundle/lib/${{ matrix.library }}
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-backend-nexor-${{ matrix.os }}
          path: julia/backends/nexor/build/bundle

  docs:
    name: Executable documentation
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Download compiled backend
        uses: actions/download-artifact@v4
        with:
          name: jumpy-backend-ubuntu-latest
          path: julia/backends/highs/build/bundle

      - name: Build and execute documentation
        run: uv run --frozen --group docs sphinx-build -M html docs/source docs/build -W --keep-going
        env:
          JUMPY_LIB: ${{ github.workspace }}/julia/backends/highs/build/bundle/lib/libjumpy_highs.so

      - name: Upload documentation for inspection
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-documentation
          path: docs/build/html

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
