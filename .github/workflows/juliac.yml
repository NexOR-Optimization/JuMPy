name: juliac backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-entrypoints:
    name: Julia entry-point tests (in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'

      - name: Run entry-point tests
        run: julia --project=julia julia/test/runtests.jl

  build-lib:
    name: Build and test compiled library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - uses: julia-actions/cache@v2

      - name: Install JuliaC
        run: julia --project=@juliac -e 'using Pkg; Pkg.add("JuliaC")'

      - name: Build shared library
        working-directory: julia
        run: julia --project=@juliac build.jl shared build

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Run tests against the compiled library
        run: uv run --group tests pytest
        env:
          JUMPY_BACKEND: juliac

      - name: Select the matching Julia installation for JuliaCall
        run: echo "PYTHON_JULIAPKG_EXE=$(command -v julia)" >> "$GITHUB_ENV"

      - name: Run tests with JuliaCall sharing the compiled image
        run: uv run --group tests --extra juliacall pytest
        env:
          JUMPY_BACKEND: juliacall

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-backend-${{ matrix.os }}
          path: julia/build

  docs:
    name: Executable documentation
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Download compiled backend
        uses: actions/download-artifact@v4
        with:
          name: jumpy-backend-ubuntu-latest
          path: julia/build

      - name: Build and execute documentation
        run: uv run --frozen --group docs sphinx-build -M html docs/source docs/build -W --keep-going
        env:
          JUMPY_LIB: ${{ github.workspace }}/julia/build/lib/libjumpy_highs.so

      - name: Upload documentation for inspection
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-documentation
          path: docs/build/html

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
