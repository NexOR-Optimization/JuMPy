name: juliac backend

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test-entrypoints:
    name: Julia entry-point tests (in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13.2"

      - uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=julia/test -e 'using Pkg; Pkg.instantiate()'

      - name: Run entry-point tests
        run: julia --project=julia/test julia/test/runtests.jl

  build-lib:
    name: Build and test compiled library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      JULIA_CPU_TARGET: generic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: libjumpy_highs.so
          - os: macos-latest
            library: libjumpy_highs.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13.2"

      - uses: julia-actions/cache@v2

      - name: Instantiate compiled backend
        run: julia --project=julia/test -e 'using Pkg; Pkg.instantiate()'

      - name: Regenerate dispatch roots
        run: |
          mkdir -p julia/build
          julia --project=julia/test --trace-dispatch=julia/build/workload.trace julia/workload.jl
          julia --project=julia/test --trace-dispatch=julia/build/tests.trace julia/test/runtests.jl
          julia --project=julia/test julia/generate_trim_dispatch.jl julia/trim_dispatch.jl julia/build/workload.trace julia/build/tests.trace

      - name: Install JuliaC
        run: julia --project=@juliac -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaC", version="0.3.12"))'

      - name: Build shared library
        working-directory: julia
        run: >
          julia --project=@juliac -m JuliaC
          --output-lib build/libjumpy_highs --project test
          --compile-ccallable
          --trim=unsafe-warn
          --jl-option handle-signals=no
          --bundle build
          --verbose
          juliac_entry.jl

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Run tests against the compiled library
        run: uv run --group tests pytest
        env:
          JUMPY_BACKEND: juliac
          JUMPY_LIB: ${{ github.workspace }}/julia/build/lib/${{ matrix.library }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-backend-${{ matrix.os }}
          path: julia/build

      - name: Build wheel with the bundle
        run: |
          python3 julia/package_bundle.py julia/build src/jumpy/_backend
          uv build --wheel

      # Outside the checkout, so that the tests import the installed package.
      - name: Test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv venv wheel-env
          uv pip install --python wheel-env "$GITHUB_WORKSPACE"/dist/*.whl pytest
          wheel-env/bin/python -c "import sys, jumpy.backend as b; lib = b.find_lib(); print(lib); sys.exit('site-packages' not in lib)"
          wheel-env/bin/python -m pytest -p no:cacheprovider "$GITHUB_WORKSPACE/tests"
        env:
          JUMPY_BACKEND: juliac

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-wheel-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Build source distribution
        run: uv build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build-lib, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jumpy-opt
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: jumpy-wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: jumpy-sdist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  build-nexor:
    name: Build and test compiled NexOR client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      JULIA_CPU_TARGET: generic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: libjumpy_nexor.so
          - os: macos-latest
            library: libjumpy_nexor.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13.2"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=julia/test -e 'using Pkg; Pkg.instantiate()'
      - name: Regenerate NexOR dispatch roots
        run: |
          mkdir -p julia/build
          julia --project=julia/test --trace-dispatch=julia/build/nexor.trace julia/test/nexor.jl
          JUMPY_BACKEND=nexor julia --project=julia/test --trace-dispatch=julia/build/nexor-workload.trace julia/workload.jl
          JUMPY_BACKEND=nexor julia --project=julia/test julia/generate_trim_dispatch.jl julia/nexor_dispatch.jl julia/build/nexor.trace julia/build/nexor-workload.trace
      - name: Install JuliaC
        run: julia --project=@juliac -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaC", version="0.3.12"))'
      - name: Build shared library
        working-directory: julia
        run: >
          julia --project=@juliac -m JuliaC
          --output-lib build/nexor/libjumpy_nexor --project test
          --compile-ccallable --trim=unsafe-warn
          --jl-option handle-signals=no
          --bundle build/nexor --verbose nexor_entry.jl
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Run tests against the compiled library
        run: uv run --group tests pytest tests/test_nexor.py tests/test_backend.py tests/test_facades.py
        env:
          JUMPY_BACKEND: nexor
          JUMPY_LIB: ${{ github.workspace }}/julia/build/nexor/lib/${{ matrix.library }}
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-backend-nexor-${{ matrix.os }}
          path: julia/build/nexor

  docs:
    name: Executable documentation
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Download compiled backend
        uses: actions/download-artifact@v4
        with:
          name: jumpy-backend-ubuntu-latest
          path: julia/build

      - name: Build and execute documentation
        run: uv run --frozen --group docs sphinx-build -M html docs/source docs/build -W --keep-going
        env:
          JUMPY_LIB: ${{ github.workspace }}/julia/build/lib/libjumpy_highs.so

      - name: Upload documentation for inspection
        uses: actions/upload-artifact@v4
        with:
          name: jumpy-documentation
          path: docs/build/html

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
