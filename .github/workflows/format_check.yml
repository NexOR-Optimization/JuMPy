name: Format check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13.2"

      - name: Install JuliaFormatter
        shell: julia --project=@formatter --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name="JuliaFormatter", version="2"))

      - name: Check formatting
        run: |
          julia --project=@formatter -e 'using JuliaFormatter; format("."; verbose = true, throw_on_error = true)'
          git diff --exit-code
