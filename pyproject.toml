[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jumpy-opt"
version = "0.1.0"
description = "A Python interface to JuMP and GenOpt"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
juliacall = ["juliacall>=0.9.23"]

[dependency-groups]
docs = [
    "myst-parser>=4.0",
    "sphinx>=8.1,<9",
    "sphinx-book-theme>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-gallery>=0.19",
]
tests = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/jumpy"]
# Ignored by git, copied by julia/package_bundle.py.
artifacts = ["src/jumpy/_backend"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"julia/src/JuMPyModel.jl" = "jumpy/julia/JuMPyModel.jl"
